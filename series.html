<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="stillbigjosh writeup series">
<meta property="og:type" content="article">
<meta property="og:site_name" content="stillbigjosh">
<meta property="og:title" content="Series - stillbigjosh">
<meta property="og:description" content="">
<meta property="og:url" content="">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Series - stillbigjosh">
<meta name="twitter:description" content="">
<title>Series - stillbigjosh</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐋</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #1d2021;
    --bg-alt:    #282828;
    --card:      #3c3836;
    --card-hover:#45403f;
    --heading:   #ebdbb2;
    --text:      #d5c4a1;
    --muted:     #bdae93;
    --dim:       #928374;
    --border:    #504945;
    --accent:    #d8a657;
    --accent-h:  #e0b974;
    --yellow:    #fabd2f;
    --orange:    #fe8019;
    --red:       #fb4934;
    --teal:      #8ec07c;
    --purple:    #d3869b;
    --blue:      #83a598;
    --radius:    10px;

    --glow-accent: rgba(216, 166, 87, 0.25);

    --display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI',
               Roboto, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
            Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    --mono: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas,
            'Courier New', monospace;

    --main-width: 760px;
  }

  html {
    scroll-behavior: smooth;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body { min-height: 100vh; line-height: 1.6; overflow-x: hidden; }

  a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
  a:hover { color: var(--accent-h); }

  ::selection { background: var(--accent); color: var(--bg); }

  /* ── Navigation ──────────────────────────────────────────────── */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(29, 32, 33, 0.86);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: var(--main-width);
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .nav-logo {
    color: var(--heading);
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 16px;
    font-family: var(--mono);
  }
  .nav-logo .dot { color: var(--accent); }
  .nav-back {
    color: var(--muted);
    font-size: 13.5px;
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-back:hover { color: var(--accent); }

  /* ── Hero ─────────────────────────────────────────────────────── */
  .series-hero {
    max-width: var(--main-width);
    margin: 0 auto;
    padding: 56px 24px 0;
  }
  .series-kicker {
    background: linear-gradient(90deg, var(--accent), var(--orange), var(--accent));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shimmer 4s ease-in-out infinite;
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  @keyframes shimmer {
    0%, 100% { background-position: 0% center; }
    50% { background-position: 200% center; }
  }
  .series-title {
    color: var(--heading);
    font-family: var(--display);
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.8px;
    line-height: 1.18;
  }
  .series-desc {
    color: var(--muted);
    font-size: 16px;
    line-height: 1.75;
    margin-top: 18px;
    max-width: 620px;
  }
  .series-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 16px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12.5px;
  }

  /* ── Parts list ──────────────────────────────────────────────── */
  .parts {
    max-width: var(--main-width);
    margin: 0 auto;
    padding: 40px 24px 60px;
  }
  .parts-label {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 18px;
  }
  .parts-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .part-card {
    display: grid;
    grid-template-columns: 48px 1fr;
    gap: 18px;
    align-items: start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                background 0.25s ease;
  }
  a.part-card:hover {
    border-color: var(--accent);
    background: var(--card-hover);
    transform: translateY(-2px);
    box-shadow: 0 8px 32px rgba(0,0,0,0.3),
                0 0 0 1px var(--accent),
                0 0 20px var(--glow-accent);
  }

  .part-num {
    color: var(--accent);
    font-family: var(--display);
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    padding-top: 2px;
  }
  .part-body {}
  .part-title {
    color: var(--heading);
    font-family: var(--display);
    font-size: 17px;
    font-weight: 700;
    line-height: 1.3;
  }
  .part-kicker {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.5px;
    margin-top: 4px;
  }
  .part-desc {
    color: var(--text);
    font-size: 14.5px;
    line-height: 1.7;
    margin-top: 8px;
  }
  .part-action {
    color: var(--accent);
    font-size: 13px;
    font-family: var(--mono);
    margin-top: 10px;
    display: inline-block;
  }
  a.part-card:hover .part-action { color: var(--accent-h); }

  /* ── Share bar ───────────────────────────────────────────────── */
  .share-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
  }
  .share-label {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .share-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .share-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex-shrink: 0;
  }
  .share-btn.copied {
    color: var(--accent);
    border-color: var(--accent);
  }

  /* ── Footer ──────────────────────────────────────────────────── */
  .footer {
    border-top: 1px solid var(--border);
    padding: 26px 24px;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
    font-family: var(--mono);
    max-width: var(--main-width);
    margin: 0 auto;
  }

  /* ── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 640px) {
    .nav-inner { padding: 12px 16px; }
    .series-hero { padding: 40px 16px 0; }
    .series-title { font-size: 26px; }
    .parts { padding: 32px 16px 48px; }
    .part-card { grid-template-columns: 36px 1fr; gap: 14px; padding: 18px 16px; }
    .part-num { font-size: 22px; }
  }
</style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-logo">stillbigjosh<span class="dot">_</span></a>
      <a href="index.html#projects" class="nav-back">&larr; back to projects</a>
    </div>
  </nav>

  <header class="series-hero" id="hero"></header>
  <section class="parts">
    <p class="parts-label">Reading Order</p>
    <div class="parts-list" id="parts-list"></div>
  </section>

  <footer class="footer">
    stillbigjosh &copy; 2026 &middot; built with purpose
  </footer>

  <script>
    var SERIES = {
      adaptix: {
        title: 'Hardening Adaptix C2',
        kicker: 'Red Team . C2 Infrastructure . OPSEC',
        desc: 'A multi-part series on hardening an Adaptix C2 deployment for red team operations. Covers initial setup, reducing infrastructure and agent fingerprints, and modifying beacon source code to remove static detection signatures.',
        tags: 'Adaptix C2 . Red Team . OPSEC',
        parts: [
          {
            file: 'writeups/adaptix-setup.md',
            title: 'Adaptix C2 Setup',
            kicker: 'C2 Infrastructure . Lab Build',
            desc: 'Deploying an Adaptix C2 teamserver on Ludus for red team operations and adversary simulation exercises.'
          },
          {
            file: 'writeups/adaptix-hardening.md',
            title: 'Reducing Infrastructure and Agent Fingerprints',
            kicker: 'C2 Infrastructure . OPSEC . Red Team',
            desc: 'Replacing default signatures across the Adaptix C2 stack to reduce the fingerprint surface that threat intel and blue teams use to identify red team infrastructure.'
          },
          {
            file: 'writeups/adaptix-beacon-mods.md',
            title: 'Beacon Source Modifications',
            kicker: 'Static Evasion . Source Modification . Red Team',
            desc: 'Tracing ThreatCheck detections through Ghidra back to the beacon agent source code and making targeted edits to change the compiled output without breaking functionality.'
          }
        ]
      },
      ad: {
        title: 'Active Directory',
        kicker: 'Purple Team . Active Directory . Elastic',
        desc: 'Building and attacking Active Directory environments with full defensive visibility. From deploying a multi-domain cyber range with Elastic stack monitoring to structured detection scenarios that map attacks to Elastic rules and KQL queries.',
        tags: 'Active Directory . Elastic . Purple Team',
        parts: [
          {
            file: 'writeups/goad-writeup.md',
            title: 'Active Directory Cyber-range with Elastic Stack',
            kicker: 'Homelab . Ludus v2 . Cyber Range',
            desc: 'Building an Active Directory attack lab layered with a full Elastic stack, built end-to-end on a Proxmox host.'
          },
          {
            file: 'writeups/detection-scenarios.md',
            title: 'Detection Scenarios for Active Directory',
            kicker: 'Purple Team . Elastic SIEM/EDR',
            desc: 'Structured detection practice: 8 attack scenarios mapped to Elastic prebuilt rules, KQL confirmation queries, opsec research questions, and custom rule building for detection gaps.'
          }
        ]
      }
    };

    (function () {
      var params = new URLSearchParams(window.location.search);
      var seriesId = params.get('series');

      // Only allow known series IDs (keys of SERIES object)
      var series = seriesId && SERIES.hasOwnProperty(seriesId) ? SERIES[seriesId] : null;

      if (!series) {
        var errP = document.createElement('p');
        errP.style.cssText = 'color:var(--muted);margin-top:40px;';
        errP.textContent = 'Series not found.';
        document.getElementById('hero').appendChild(errP);
        return;
      }

      document.title = series.title + ' - stillbigjosh';
      document.querySelector('meta[name="description"]').setAttribute('content', series.desc);
      document.querySelector('meta[property="og:title"]').setAttribute('content', series.title + ' - stillbigjosh');
      document.querySelector('meta[property="og:description"]').setAttribute('content', series.desc);
      document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
      document.querySelector('meta[name="twitter:title"]').setAttribute('content', series.title + ' - stillbigjosh');
      document.querySelector('meta[name="twitter:description"]').setAttribute('content', series.desc);

      var hero = document.getElementById('hero');

      var kicker = document.createElement('p');
      kicker.className = 'series-kicker';
      kicker.textContent = series.kicker;
      hero.appendChild(kicker);

      var h1 = document.createElement('h1');
      h1.className = 'series-title';
      h1.textContent = series.title;
      hero.appendChild(h1);

      var descP = document.createElement('p');
      descP.className = 'series-desc';
      descP.textContent = series.desc;
      hero.appendChild(descP);

      var metaDiv = document.createElement('div');
      metaDiv.className = 'series-meta';
      var countSpan = document.createElement('span');
      countSpan.textContent = series.parts.length + ' parts';
      var sepSpan = document.createElement('span');
      sepSpan.style.color = 'var(--border)';
      sepSpan.innerHTML = '&middot;';
      var tagsSpan = document.createElement('span');
      tagsSpan.textContent = series.tags;
      metaDiv.appendChild(countSpan);
      metaDiv.appendChild(sepSpan);
      metaDiv.appendChild(tagsSpan);
      hero.appendChild(metaDiv);

      var shareBarDiv = document.createElement('div');
      shareBarDiv.className = 'share-bar';
      shareBarDiv.id = 'share-bar';
      hero.appendChild(shareBarDiv);

      var partsList = document.getElementById('parts-list');
      series.parts.forEach(function (part, i) {
        var a = document.createElement('a');
        a.href = 'writeup.html?file=' + encodeURIComponent(part.file);
        a.className = 'part-card';

        var numDiv = document.createElement('div');
        numDiv.className = 'part-num';
        numDiv.textContent = String(i + 1).padStart(2, '0');

        var bodyDiv = document.createElement('div');
        bodyDiv.className = 'part-body';

        var titleP = document.createElement('p');
        titleP.className = 'part-title';
        titleP.textContent = part.title;

        var kickerP = document.createElement('p');
        kickerP.className = 'part-kicker';
        kickerP.textContent = part.kicker;

        var descP = document.createElement('p');
        descP.className = 'part-desc';
        descP.textContent = part.desc;

        var actionSpan = document.createElement('span');
        actionSpan.className = 'part-action';
        actionSpan.innerHTML = '&rarr; read';

        bodyDiv.appendChild(titleP);
        bodyDiv.appendChild(kickerP);
        bodyDiv.appendChild(descP);
        bodyDiv.appendChild(actionSpan);
        a.appendChild(numDiv);
        a.appendChild(bodyDiv);
        partsList.appendChild(a);
      });

      // Share bar
      var pageUrl = window.location.href;
      var pageTitle = series.title + ' - stillbigjosh';
      var encodedUrl = encodeURIComponent(pageUrl);
      var xIcon = '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
      var linkedInIcon = '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
      var copyIcon = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';

      var shareBar = document.getElementById('share-bar');
      shareBar.innerHTML =
        '<span class="share-label">Share</span>' +
        '<a class="share-btn" href="https://x.com/intent/tweet?url=' + encodedUrl + '&text=' + encodeURIComponent(pageTitle) + '" target="_blank" rel="noopener">' + xIcon + 'X</a>' +
        '<a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl + '" target="_blank" rel="noopener">' + linkedInIcon + 'LinkedIn</a>' +
        '<button class="share-btn copy-url-btn" type="button">' + copyIcon + 'Copy URL</button>';

      shareBar.querySelector('.copy-url-btn').addEventListener('click', function () {
        var btn = this;
        navigator.clipboard.writeText(pageUrl).then(function () {
          btn.classList.add('copied');
          btn.innerHTML = copyIcon + 'Copied';
          setTimeout(function () {
            btn.classList.remove('copied');
            btn.innerHTML = copyIcon + 'Copy URL';
          }, 2000);
        });
      });
    })();
  </script>

</body>
</html>
