  <rect x="50" y="320" width="320" height="160" rx="10" fill="url(#workerBg)" stroke="#30363d" stroke-width="1.5"/>

  <rect x="50" y="320" width="320" height="32" rx="10" fill="#21262d"/>
  <rect x="50" y="340" width="320" height="12" fill="#21262d"/>
  <circle cx="68" cy="336" r="5" fill="#58a6ff"/>
