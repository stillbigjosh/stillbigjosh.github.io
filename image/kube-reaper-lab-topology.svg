  <rect x="475" y="122" width="80" height="28" rx="5" fill="#1c2128" stroke="#3fb950" stroke-width="1"/>
  <text x="515" y="140" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">etcd</text>

  <rect x="565" y="122" width="95" height="28" rx="5" fill="#1c2128" stroke="#3fb950" stroke-width="1"/>
  <text x="612" y="140" text-anchor="middle" fill="#3fb950" font-size="10" font-weight="600">scheduler</text>

