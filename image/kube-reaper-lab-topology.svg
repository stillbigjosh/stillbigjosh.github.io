  <text x="225" y="380" text-anchor="middle" fill="#58a6ff" font-size="10" font-weight="600">calico-typha</text>

  <rect x="285" y="362" width="70" height="28" rx="5" fill="#1c2128" stroke="#da3633" stroke-width="1"/>
