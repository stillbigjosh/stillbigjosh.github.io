  <rect x="475" y="698" width="65" height="17" rx="3" fill="#da363333" stroke="#da3633" stroke-width="0.8"/>
  <text x="507" y="710" text-anchor="middle" fill="#f85149" font-size="9" font-weight="700">NONE</text>

  <!-- other namespaces -->
