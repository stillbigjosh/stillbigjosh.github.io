<style>
  /* ── Reset & Base (matches main site) ────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #282828;
    --bg-alt:    #32302f;
    --card:      #3c3836;
    --card-hover:#45403f;
    --heading:   #ebdbb2;
    --text:      #d5c4a1;
    --muted:     #bdae93;
    --dim:       #928374;
    --border:    #504945;
    --accent:    #b8bb26;
    --accent-h:  #d5d34a;
    --yellow:    #fabd2f;
    --orange:    #fe8019;
    --red:       #fb4934;
    --radius:    10px;

    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen,
            Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
    --mono: 'SFMono-Regular', 'JetBrains Mono', Menlo, Consolas,
            'Courier New', monospace;

    --main-width: 760px;
    --sidebar-width: 260px;
  }

  html {
    scroll-behavior: smooth;
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  body { min-height: 100vh; line-height: 1.6; }

  a { color: var(--accent); text-decoration: none; }
  a:hover { color: var(--accent-h); }

  ::selection { background: var(--accent); color: var(--bg); }

  /* ── Navigation (matches main site) ──────────────────────────── */
  .nav {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(40, 40, 40, 0.86);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
  }
  .nav-inner {
    max-width: 1200px;
    margin: 0 auto;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
  }
  .nav-logo {
    color: var(--heading);
    font-weight: 700;
    letter-spacing: 0.5px;
    font-size: 16px;
    font-family: var(--mono);
  }
  .nav-logo .dot { color: var(--accent); }
  .nav-back {
    color: var(--muted);
    font-size: 13.5px;
    font-family: var(--mono);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .nav-back:hover { color: var(--accent); }

  /* ── Layout: sidebar + main ──────────────────────────────────── */
  .layout {
    max-width: 1200px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: var(--sidebar-width) 1fr;
    gap: 0;
    min-height: calc(100vh - 56px);
  }

  /* ── Sidebar ─────────────────────────────────────────────────── */
  .sidebar {
    position: sticky;
    top: 56px;
    height: calc(100vh - 56px);
    overflow-y: auto;
    border-right: 1px solid var(--border);
    padding: 24px 0;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .sidebar-label {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 0 20px;
    margin-bottom: 12px;
  }

  .sidebar-nav {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .sidebar-nav a {
    display: block;
    padding: 10px 20px;
    color: var(--text);
    font-size: 13.5px;
    line-height: 1.4;
    border-left: 3px solid transparent;
    transition: all 0.15s ease;
  }
  .sidebar-nav a:hover {
    background: var(--bg-alt);
    color: var(--accent);
    border-left-color: var(--accent);
  }
  .sidebar-nav a.active {
    background: var(--bg-alt);
    color: var(--accent);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .sidebar-nav .nav-kicker {
    display: block;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.5px;
    margin-top: 3px;
  }
  .sidebar-nav a:hover .nav-kicker,
  .sidebar-nav a.active .nav-kicker { color: var(--muted); }

  .sidebar-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 16px 20px;
  }

  .sidebar-home {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    color: var(--muted);
    font-size: 13px;
    font-family: var(--mono);
    transition: color 0.15s;
  }
  .sidebar-home:hover { color: var(--accent); }

  /* ── Main content area ───────────────────────────────────────── */
  .main { padding: 0 24px; }

  /* ── Article shell ────────────────────────────────────────────── */
  .article-hero {
    max-width: var(--main-width);
    padding: 48px 0 0;
  }
  .kicker {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12.5px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .article-title {
    color: var(--heading);
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -0.8px;
    line-height: 1.18;
  }
  .article-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    margin-top: 16px;
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12.5px;
  }
  .article-meta span { display: flex; align-items: center; gap: 6px; }
  .article-meta .sep { color: var(--border); }

  .lead {
    color: var(--muted);
    font-size: 16.5px;
    line-height: 1.75;
    margin-top: 22px;
    max-width: 620px;
  }

  /* ── Content wrapper ──────────────────────────────────────────── */
  .content {
    max-width: var(--main-width);
    padding: 8px 0 60px;
  }

  .content h2 {
    color: var(--heading);
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 52px 0 18px;
    padding-top: 6px;
    scroll-margin-top: 80px;
  }
  .content h2 .h-tag {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 16px;
    margin-right: 10px;
    font-weight: 600;
  }
  .content h3 {
    color: var(--heading);
    font-size: 18px;
    font-weight: 700;
    margin: 30px 0 12px;
    scroll-margin-top: 80px;
  }
  .content h4 {
    color: var(--yellow);
    font-size: 15px;
    font-weight: 700;
    margin: 24px 0 10px;
    font-family: var(--mono);
    letter-spacing: 0.2px;
  }

  .content p {
    color: var(--text);
    font-size: 15.5px;
    line-height: 1.8;
    margin-bottom: 16px;
  }
  .content strong { color: var(--heading); font-weight: 700; }
  .content em { color: var(--muted); font-style: italic; }

  .content ul, .content ol {
    margin: 0 0 18px 22px;
    color: var(--text);
    font-size: 15.5px;
    line-height: 1.8;
  }
  .content li { margin-bottom: 6px; }
  .content li strong { color: var(--heading); }

  .content code {
    font-family: var(--mono);
    background: var(--bg-alt);
    border: 1px solid var(--border);
    color: var(--accent-h);
    padding: 1px 6px;
    border-radius: 5px;
    font-size: 0.88em;
    white-space: nowrap;
  }

  .content pre {
    background: var(--bg-alt);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    overflow-x: auto;
    margin: 6px 0 22px;
  }
  .content pre code {
    background: none;
    border: none;
    color: var(--accent);
    padding: 0;
    font-size: 13.5px;
    line-height: 1.65;
    white-space: pre;
    display: block;
  }
  .content pre .cmt { color: var(--dim); }

  hr.divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 46px 0;
  }

  blockquote, .callout {
    border-left: 3px solid var(--accent);
    background: var(--card);
    border-radius: 0 var(--radius) var(--radius) 0;
    padding: 14px 18px;
    margin: 18px 0 22px;
    color: var(--muted);
    font-size: 14.5px;
    line-height: 1.75;
  }
  .callout strong { color: var(--heading); }
  .callout.warn { border-left-color: var(--orange); }
  .callout.note { border-left-color: var(--yellow); }

  /* ── Figures / images ─────────────────────────────────────────── */
  figure {
    margin: 22px 0 30px;
  }
  figure img {
    width: 100%;
    display: block;
    border-radius: var(--radius);
    border: 1px solid var(--border);
  }
  figcaption {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 12px;
    text-align: center;
    margin-top: 9px;
    letter-spacing: 0.2px;
  }

  /* ── Table of contents ────────────────────────────────────────── */
  .toc-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 24px;
    margin: 30px 0 10px;
  }
  .toc-title {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 14px;
  }
  .toc-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .toc-list a {
    display: flex;
    align-items: baseline;
    gap: 10px;
    color: var(--text);
    font-size: 14px;
    padding: 6px 8px;
    border-radius: 6px;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .toc-list a:hover { background: var(--bg-alt); color: var(--accent); }
  .toc-num {
    color: var(--accent);
    font-family: var(--mono);
    font-size: 12px;
    flex-shrink: 0;
    width: 20px;
  }

  /* ── Tables ───────────────────────────────────────────────────── */
  .kv-table {
    width: 100%;
    border-collapse: collapse;
    margin: 6px 0 24px;
    font-size: 14px;
    font-family: var(--mono);
  }
  .kv-table th, .kv-table td {
    text-align: left;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    color: var(--text);
  }
  .kv-table th { color: var(--dim); font-weight: 600; font-size: 12px; letter-spacing: 0.5px; }

  /* ── Table horizontal scroll ─────────────────────────────────── */
  .table-wrap {
    overflow-x: auto;
    margin: 6px 0 24px;
  }
  .table-wrap .kv-table { margin: 0; }

  /* ── Back-to-top / footer nav ─────────────────────────────────── */
  .article-footer-nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 30px;
    margin-top: 10px;
    border-top: 1px solid var(--border);
  }
  .article-footer-nav a {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
  }
  .article-footer-nav a:hover { color: var(--accent); }

  .footer {
    border-top: 1px solid var(--border);
    padding: 26px 24px;
    text-align: center;
    color: var(--dim);
    font-size: 13px;
    font-family: var(--mono);
    max-width: var(--main-width);
    margin: 20px 0 0;
  }

  /* ── Share bar ────────────────────────────────────────────────── */
  .share-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 22px;
  }
  .share-bar .share-label {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-right: 4px;
  }
  .share-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
    text-decoration: none;
  }
  .share-btn:hover {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--card-hover);
  }
  .share-btn svg {
    width: 14px;
    height: 14px;
    fill: currentColor;
    flex-shrink: 0;
  }
  .share-btn.copied {
    color: var(--accent);
    border-color: var(--accent);
  }

  .share-bar-footer {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
  }
  .share-bar-footer .share-label {
    color: var(--dim);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-right: 4px;
  }

  /* ── Responsive ──────────────────────────────────────────────── */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar {
      position: relative;
      top: 0;
      height: auto;
      border-right: none;
      border-bottom: 1px solid var(--border);
      padding: 16px 0;
    }
    .sidebar-nav {
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0;
      padding: 0 12px;
    }
    .sidebar-nav a {
      border-left: none;
      border-bottom: 3px solid transparent;
      padding: 8px 12px;
      font-size: 12.5px;
    }
    .sidebar-nav a:hover,
    .sidebar-nav a.active {
      border-left-color: transparent;
      border-bottom-color: var(--accent);
    }
    .sidebar-nav .nav-kicker { display: none; }
    .sidebar-label { padding: 0 16px; margin-bottom: 8px; }
    .sidebar-divider { margin: 8px 16px; }
    .sidebar-home { padding: 8px 16px; }
    .main { padding: 0 16px; }
    .article-hero { padding: 36px 0 0; }
    .article-title { font-size: 27px; }
  }

  @media (max-width: 640px) {
    .nav-inner { padding: 12px 16px; }
    .content h2 { font-size: 20px; }
    .kv-table { font-size: 12.5px; }
  }
</style>

<body>

  <!-- ── Navigation ─────────────────────────────────────────────── -->
  <nav class="nav">
    <div class="nav-inner">
      <span class="nav-logo">stillbigjosh<span class="dot">_</span></span>
      <a href="index.html#projects" class="nav-back">&larr; back to projects</a>
    </div>
  </nav>

  <!-- ── Layout: sidebar + main ─────────────────────────────────── -->
  <div class="layout">

    <!-- ── Sidebar navigator ──────────────────────────────────────── -->
    <aside class="sidebar">
      <p class="sidebar-label">Writeups</p>
      <ul class="sidebar-nav" id="sidebar-nav"></ul>
      <hr class="sidebar-divider">
      <a href="index.html" class="sidebar-home">&larr; stillbigjosh.github.io</a>
    </aside>

    <!-- ── Main article ───────────────────────────────────────────── -->
    <div class="main">
      <header class="article-hero" id="hero">
        <p class="kicker" id="kicker"></p>
        <h1 class="article-title" id="title"></h1>
        <div class="article-meta" id="meta"></div>
        <p class="lead" id="lead"></p>
        <div class="share-bar" id="share-bar"></div>
      </header>

      <div class="content" id="content"></div>

      <footer class="footer">
        stillbigjosh &copy; 2026 &middot; built with purpose
      </footer>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script>
    // ── Writeup registry ──────────────────────────────────────────
    // Add new writeups here. Order determines sidebar order.
    var WRITEUPS = [
      {
        file: 'writeups/adaptix-hardening.md',
        title: 'Hardening Adaptix C2',
        kicker: 'C2 Infrastructure · OPSEC'
      },
      {
        file: 'writeups/adaptix-setup.md',
        title: 'Adaptix C2 Setup',
        kicker: 'C2 Infrastructure · Lab Build'
      },
      {
        file: 'writeups/detection-scenarios.md',
        title: 'Detection Scenarios for Active Directory',
        kicker: 'Purple Team · Elastic SIEM/EDR'
      },
      {
        file: 'writeups/goad-writeup.md',
        title: 'Active Directory Cyber-range with Elastic Stack',
        kicker: 'Homelab · Cyber Range'
      }
    ];

    // ── Load a markdown writeup and render it with the site theme ──
    // Usage: writeup.html?file=writeups/my-writeup.md
    (function () {
      var params = new URLSearchParams(window.location.search);
      var file = params.get('file') || 'writeups/goad-writeup.md';

      // Build sidebar
      var sidebarNav = document.getElementById('sidebar-nav');
      WRITEUPS.forEach(function (w) {
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = 'writeup.html?file=' + w.file;
        if (w.file === file) a.classList.add('active');
        a.textContent = w.title;
        var span = document.createElement('span');
        span.className = 'nav-kicker';
        span.textContent = w.kicker;
        a.appendChild(span);
        li.appendChild(a);
        sidebarNav.appendChild(li);
      });

      function slugify(text) {
        return text.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
      }

      function estimateReadTime(body) {
        var words = body.replace(/[#*`>!\[\]()\-]/g, ' ').split(/\s+/).filter(Boolean).length;
        var mins = Math.max(1, Math.round(words / 200));
        return '~' + mins + ' min read';
      }

      function parseFrontmatter(raw) {
        var m = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
        if (!m) return { meta: {}, body: raw };
        var meta = {};
        m[1].split('\n').forEach(function (line) {
          var idx = line.indexOf(':');
          if (idx === -1) return;
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim();
          val = val.replace(/^["']|["']$/g, '');
          meta[key] = val;
        });
        return { meta: meta, body: raw.slice(m[0].length) };
      }

      function postProcess(html) {
        var div = document.createElement('div');
        div.innerHTML = html;

        // h2 -> prepend the "##" tag prefix
        div.querySelectorAll('h2').forEach(function (h) {
          h.innerHTML = '<span class="h-tag">##</span>' + h.innerHTML;
        });

        // code blocks -> dim comment lines (lines starting with #)
        div.querySelectorAll('pre code').forEach(function (code) {
          var lines = code.innerHTML.split('\n');
          code.innerHTML = lines.map(function (line) {
            if (line.trim().startsWith('#')) {
              return '<span class="cmt">' + line + '</span>';
            }
            return line;
          }).join('\n');
        });

        // figures: image paragraph followed by an italic caption paragraph
        var ps = Array.prototype.slice.call(div.querySelectorAll('p'));
        ps.forEach(function (p, i) {
          var img = p.querySelector('img');
          if (!img) return;
          var next = ps[i + 1];
          if (next && next.querySelector('em') && !next.querySelector('img')) {
            var fig = document.createElement('figure');
            var cap = document.createElement('figcaption');
            cap.textContent = next.querySelector('em').textContent;
            fig.appendChild(img.cloneNode(true));
            fig.appendChild(cap);
            p.replaceWith(fig);
            next.remove();
          }
        });

        // callouts: blockquotes starting with [!NOTE] / [!WARN]
        div.querySelectorAll('blockquote').forEach(function (bq) {
          var text = bq.textContent.trim();
          var cls = '';
          if (text.startsWith('[!NOTE]')) { cls = 'note'; bq.innerHTML = bq.innerHTML.replace('[!NOTE]', ''); }
          else if (text.startsWith('[!WARN]')) { cls = 'warn'; bq.innerHTML = bq.innerHTML.replace('[!WARN]', ''); }
          if (cls) bq.classList.add('callout', cls);
        });

        // tables -> kv-table styling
        div.querySelectorAll('table').forEach(function (t) { t.classList.add('kv-table'); });

        // horizontal rules -> divider
        div.querySelectorAll('hr').forEach(function (h) { h.classList.add('divider'); });

        return div.innerHTML;
      }

      function buildToc(content, meta) {
        var headings = content.querySelectorAll('h2, h3');
        if (!headings.length) return;

        var toc = document.createElement('div');
        toc.className = 'toc-card';
        toc.innerHTML = '<p class="toc-title">Table of Contents</p>';
        var ul = document.createElement('ul');
        ul.className = 'toc-list';

        var num = 0;
        headings.forEach(function (h) {
          var label = h.textContent.replace('##', '').trim();
          var id = slugify(label);
          h.id = id;
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = '#' + id;
          var span = document.createElement('span');
          span.className = 'toc-num';
          if (h.tagName === 'H2') {
            num++;
            span.textContent = String(num).padStart(2, '0');
          } else {
            span.textContent = '•';
          }
          a.appendChild(span);
          a.appendChild(document.createTextNode(label));
          li.appendChild(a);
          ul.appendChild(li);
        });

        // optional extra TOC link (e.g. a "Part 2" external link)
        if (meta.toc_extra) {
          var parts = meta.toc_extra.split('|');
          var li = document.createElement('li');
          var a = document.createElement('a');
          a.href = parts[1] || '#';
          a.target = '_blank';
          a.rel = 'noopener';
          var span = document.createElement('span');
          span.className = 'toc-num';
          span.textContent = '•';
          a.appendChild(span);
          a.appendChild(document.createTextNode(parts[0]));
          li.appendChild(a);
          ul.appendChild(li);
        }

        toc.appendChild(ul);
        content.insertBefore(toc, content.firstChild);
      }

      function render(meta, body) {
        // hero
        document.getElementById('kicker').textContent = meta.kicker || 'Writeup';
        document.getElementById('title').textContent = meta.title || 'Untitled';
        document.title = (meta.title || 'Writeup') + ' - stillbigjosh';

        var desc = meta.lead || meta.title || '';
        var fullTitle = (meta.title || 'Writeup') + ' - stillbigjosh';
        document.querySelector('meta[name="description"]').setAttribute('content', desc);
        document.querySelector('meta[property="og:title"]').setAttribute('content', fullTitle);
        document.querySelector('meta[property="og:description"]').setAttribute('content', desc);
        document.querySelector('meta[property="og:url"]').setAttribute('content', window.location.href);
        document.querySelector('meta[name="twitter:title"]').setAttribute('content', fullTitle);
        document.querySelector('meta[name="twitter:description"]').setAttribute('content', desc);

        var metaEl = document.getElementById('meta');
        var tags = meta.tags ? meta.tags.split('·').map(function (s) { return s.trim(); }).join(' · ') : '';
        var readTime = meta.read_time || estimateReadTime(body);
        metaEl.innerHTML =
          '<span>stillbigjosh</span>' +
          '<span class="sep">·</span>' +
          (tags ? '<span>' + tags + '</span><span class="sep">·</span>' : '') +
          '<span>' + readTime + '</span>';
        document.getElementById('lead').textContent = meta.lead || '';

        // body
        var content = document.getElementById('content');
        content.innerHTML = postProcess(marked.parse(body));

        // TOC
        buildToc(content, meta);

        // share buttons
        var pageUrl = window.location.href;
        var pageTitle = meta.title || 'Writeup';
        var encodedUrl = encodeURIComponent(pageUrl);
        var encodedTitle = encodeURIComponent(pageTitle);

        var xIcon = '<svg viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>';
        var linkedInIcon = '<svg viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>';
        var copyIcon = '<svg viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>';

        function buildShareButtons(container) {
          container.innerHTML =
            '<span class="share-label">Share</span>' +
            '<a class="share-btn" href="https://x.com/intent/tweet?url=' + encodedUrl + '&text=' + encodeURIComponent(pageTitle + ' by @stillbigjosh') + '" target="_blank" rel="noopener">' + xIcon + 'X</a>' +
            '<a class="share-btn" href="https://www.linkedin.com/sharing/share-offsite/?url=' + encodedUrl + '" target="_blank" rel="noopener">' + linkedInIcon + 'LinkedIn</a>' +
            '<button class="share-btn copy-url-btn" type="button">' + copyIcon + 'Copy URL</button>';

          container.querySelector('.copy-url-btn').addEventListener('click', function () {
            var btn = this;
            navigator.clipboard.writeText(pageUrl).then(function () {
              btn.classList.add('copied');
              btn.innerHTML = copyIcon + 'Copied';
              setTimeout(function () {
                btn.classList.remove('copied');
                btn.innerHTML = copyIcon + 'Copy URL';
              }, 2000);
            });
          });
        }

        // hero share bar
        buildShareButtons(document.getElementById('share-bar'));

        // footer nav
        var footerNav = document.createElement('div');
        footerNav.className = 'article-footer-nav';
        footerNav.innerHTML =
          '<a href="#hero">&uarr; back to top</a>' +
          '<a href="index.html#projects">&larr; back to projects</a>';
        content.appendChild(footerNav);

        // footer share bar
        var footerShare = document.createElement('div');
        footerShare.className = 'share-bar share-bar-footer';
        buildShareButtons(footerShare);
        content.appendChild(footerShare);
      }

      fetch(file)
        .then(function (res) {
          if (!res.ok) throw new Error('not found');
          return res.text();
        })
        .then(function (raw) {
          var parsed = parseFrontmatter(raw);
          render(parsed.meta, parsed.body);
        })
        .catch(function () {
          document.getElementById('content').innerHTML =
            '<p>Could not load writeup: <code>' + file + '</code></p>';
        });
    })();
  </script>

</body>
</html>
