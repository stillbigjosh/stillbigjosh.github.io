<svg width="680" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>GOADLight Network Topology with Adaptix C2</title>
  <desc>Network diagram showing the GOADLight cyber range topology including WireGuard access, VLAN 10 AD environment, VLAN 20 monitoring, and the Adaptix C2 server.</desc>

  <style>
    text { font-family: system-ui, -apple-system, sans-serif; }
    .title { font-size: 14px; font-weight: 500; }
    .label { font-size: 12px; font-weight: 400; }
    .small { font-size: 11px; font-weight: 400; }
    .mono { font-family: ui-monospace, monospace; font-size: 11px; }

    /* Light mode defaults */
    .bg { fill: #ffffff; }
    .bus { stroke: #94a3b8; stroke-width: 2; }
    .wire { stroke: #94a3b8; stroke-width: 1.5; }
    .dash { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 6 4; }
    .callback { stroke: #94a3b8; stroke-width: 1; stroke-dasharray: 4 3; }
    .text-primary { fill: #1e293b; }
    .text-secondary { fill: #64748b; }

    .node-purple { fill: #ede9fe; stroke: #8b5cf6; stroke-width: 1.5; }
    .text-purple { fill: #5b21b6; }
    .node-gray { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .text-gray { fill: #334155; }
    .node-blue { fill: #dbeafe; stroke: #3b82f6; stroke-width: 1.5; }
    .text-blue { fill: #1e40af; }
    .node-coral { fill: #ffe4e6; stroke: #f43f5e; stroke-width: 1.5; }
    .text-coral { fill: #be123c; }
    .node-teal { fill: #ccfbf1; stroke: #14b8a6; stroke-width: 1.5; }
    .text-teal { fill: #0f766e; }
    .vlan10-bg { fill: #dbeafe; opacity: 0.5; }
    .vlan20-bg { fill: #fef3c7; opacity: 0.5; }
    .info-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }
    .legend-bg { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; }
      .bus { stroke: #475569; }
      .wire { stroke: #475569; }
      .dash { stroke: #475569; }
      .callback { stroke: #475569; }
      .text-primary { fill: #e2e8f0; }
      .text-secondary { fill: #94a3b8; }

      .node-purple { fill: #2e1065; stroke: #7c3aed; }
      .text-purple { fill: #c4b5fd; }
      .node-gray { fill: #1e293b; stroke: #475569; }
      .text-gray { fill: #cbd5e1; }
      .node-blue { fill: #1e3a5f; stroke: #3b82f6; }
      .text-blue { fill: #93c5fd; }
      .node-coral { fill: #4c0519; stroke: #f43f5e; }
      .text-coral { fill: #fda4af; }
      .node-teal { fill: #042f2e; stroke: #14b8a6; }
      .text-teal { fill: #5eead4; }
      .vlan10-bg { fill: #1e3a5f; opacity: 0.4; }
      .vlan20-bg { fill: #78350f; opacity: 0.4; }
      .info-bg { fill: #1e293b; stroke: #334155; }
      .legend-bg { fill: #1e293b; stroke: #334155; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="680" height="620" rx="0" class="bg"/>

  <!-- Your PC -->
  <rect x="265" y="40" width="150" height="48" rx="8" class="node-purple"/>
  <text x="340" y="60" class="title text-purple" text-anchor="middle">Your PC</text>
  <text x="340" y="76" class="small text-purple" text-anchor="middle">Adaptix Client</text>

  <!-- WireGuard tunnel -->
  <line x1="340" y1="88" x2="340" y2="140" class="dash" marker-end="url(#arrow)"/>
  <text x="348" y="120" class="small text-secondary">WireGuard</text>

  <!-- Router -->
  <rect x="225" y="140" width="230" height="56" rx="8" class="node-gray"/>
  <text x="340" y="162" class="title text-gray" text-anchor="middle">GOADLight Router (VM 109)</text>
  <text x="340" y="178" class="small text-gray" text-anchor="middle">10.1.10.254 / 10.1.20.254 | vmbr1000</text>

  <!-- VLAN 10 label -->
  <rect x="40" y="226" width="430" height="24" rx="4" class="vlan10-bg"/>
  <text x="255" y="243" class="small text-secondary" text-anchor="middle">vmbr1001 VLAN 10 (10.1.10.0/24)</text>

  <!-- Lines from router to VLAN 10 -->
  <line x1="260" y1="196" x2="260" y2="260" class="wire"/>
  <line x1="340" y1="196" x2="340" y2="260" class="wire"/>
  <line x1="420" y1="196" x2="420" y2="260" class="wire"/>

  <!-- VLAN 10 horizontal bus -->
  <line x1="80" y1="260" x2="460" y2="260" class="bus"/>

  <!-- Drops to VMs -->
  <line x1="80" y1="260" x2="80" y2="290" class="wire"/>
  <line x1="210" y1="260" x2="210" y2="290" class="wire"/>
  <line x1="340" y1="260" x2="340" y2="290" class="wire"/>
  <line x1="460" y1="260" x2="460" y2="290" class="wire"/>

  <!-- DC01 -->
  <rect x="40" y="290" width="80" height="72" rx="8" class="node-blue"/>
  <text x="80" y="314" class="title text-blue" text-anchor="middle">DC01</text>
  <text x="80" y="330" class="small text-blue" text-anchor="middle">VM 110</text>
  <text x="80" y="346" class="small text-blue" text-anchor="middle">Win2019</text>
  <text x="80" y="358" class="mono text-blue" text-anchor="middle">.10</text>

  <!-- DC02 -->
  <rect x="170" y="290" width="80" height="72" rx="8" class="node-blue"/>
  <text x="210" y="314" class="title text-blue" text-anchor="middle">DC02</text>
  <text x="210" y="330" class="small text-blue" text-anchor="middle">VM 111</text>
  <text x="210" y="346" class="small text-blue" text-anchor="middle">Win2019</text>
  <text x="210" y="358" class="mono text-blue" text-anchor="middle">.11</text>

  <!-- SRV02 -->
  <rect x="300" y="290" width="80" height="72" rx="8" class="node-blue"/>
  <text x="340" y="314" class="title text-blue" text-anchor="middle">SRV02</text>
  <text x="340" y="330" class="small text-blue" text-anchor="middle">VM 112</text>
  <text x="340" y="346" class="small text-blue" text-anchor="middle">Win2019</text>
  <text x="340" y="358" class="mono text-blue" text-anchor="middle">.22</text>

  <!-- Adaptix C2 -->
  <rect x="420" y="290" width="80" height="72" rx="8" class="node-coral"/>
  <text x="460" y="314" class="title text-coral" text-anchor="middle">Adaptix</text>
  <text x="460" y="330" class="small text-coral" text-anchor="middle">LXC 202</text>
  <text x="460" y="346" class="small text-coral" text-anchor="middle">Debian 13</text>
  <text x="460" y="358" class="mono text-coral" text-anchor="middle">.50</text>

  <!-- Callback arrows -->
  <line x1="120" y1="380" x2="120" y2="420" class="callback"/>
  <line x1="250" y1="380" x2="250" y2="420" class="callback"/>
  <line x1="380" y1="380" x2="380" y2="420" class="callback"/>
  <line x1="120" y1="420" x2="460" y2="420" class="callback"/>
  <line x1="460" y1="362" x2="460" y2="420" class="callback" marker-end="url(#arrow)"/>
  <text x="290" y="438" class="small text-secondary" text-anchor="middle">implant callbacks to 10.1.10.50</text>

  <!-- VLAN 20 label -->
  <rect x="500" y="226" width="160" height="24" rx="4" class="vlan20-bg"/>
  <text x="580" y="243" class="small text-secondary" text-anchor="middle">VLAN 20 (10.1.20.0/24)</text>

  <!-- Router to VLAN 20 -->
  <line x1="455" y1="168" x2="540" y2="168" class="wire"/>
  <line x1="540" y1="168" x2="540" y2="260" class="wire"/>
  <line x1="540" y1="260" x2="620" y2="260" class="wire"/>
  <line x1="580" y1="260" x2="580" y2="290" class="wire"/>

  <!-- Elastic Server -->
  <rect x="530" y="290" width="100" height="72" rx="8" class="node-teal"/>
  <text x="580" y="314" class="title text-teal" text-anchor="middle">Elastic</text>
  <text x="580" y="330" class="small text-teal" text-anchor="middle">VM 113</text>
  <text x="580" y="346" class="small text-teal" text-anchor="middle">Kibana+Fleet</text>
  <text x="580" y="358" class="mono text-teal" text-anchor="middle">10.1.20.2</text>

  <!-- Adaptix info box -->
  <rect x="395" y="460" width="132" height="56" rx="8" class="info-bg"/>
  <text x="461" y="480" class="small text-secondary" text-anchor="middle">:8443 Teamserver</text>
  <text x="461" y="496" class="small text-secondary" text-anchor="middle">IIS/10.0 masq</text>
  <text x="461" y="510" class="small text-secondary" text-anchor="middle">TLS 1.2-1.3</text>
  <line x1="461" y1="362" x2="461" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Elastic info box -->
  <rect x="522" y="460" width="116" height="56" rx="8" class="info-bg"/>
  <text x="580" y="480" class="small text-secondary" text-anchor="middle">:9200 Elastic</text>
  <text x="580" y="496" class="small text-secondary" text-anchor="middle">:5601 Kibana</text>
  <text x="580" y="510" class="small text-secondary" text-anchor="middle">:8220 Fleet</text>
  <line x1="580" y1="362" x2="580" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Legend -->
  <rect x="40" y="548" width="600" height="50" rx="8" class="legend-bg"/>
  <rect x="56" y="564" width="14" height="14" rx="3" class="node-blue"/>
  <text x="78" y="575" class="small text-secondary">AD Targets</text>
  <rect x="152" y="564" width="14" height="14" rx="3" class="node-coral"/>
  <text x="174" y="575" class="small text-secondary">C2 Server</text>
  <rect x="248" y="564" width="14" height="14" rx="3" class="node-teal"/>
  <text x="270" y="575" class="small text-secondary">Monitoring</text>
  <rect x="348" y="564" width="14" height="14" rx="3" class="node-purple"/>
  <text x="370" y="575" class="small text-secondary">Attacker</text>
  <line x1="440" y1="571" x2="470" y2="571" class="callback"/>
  <text x="478" y="575" class="small text-secondary">Callback</text>
  <line x1="530" y1="571" x2="560" y2="571" class="dash"/>
  <text x="568" y="575" class="small text-secondary">WireGuard</text>
</svg>
